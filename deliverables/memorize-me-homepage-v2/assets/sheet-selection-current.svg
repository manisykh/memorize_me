  <rect y="1908" width="1080" height="432" fill="#FFFFFF"/>
  <line x1="0" y1="1908" x2="1080" y2="1908" stroke="#D9E2F0" stroke-width="2"/>
  <rect x="50" y="1950" width="980" height="116" rx="30" fill="#1E73F7"/>
  <text x="540" y="2025" text-anchor="middle" fill="#FFFFFF" font-size="35" font-weight="900">선택한 시트 가져오기 (2개)</text>
  <rect x="390" y="2284" width="300" height="14" rx="7" fill="#C8CDD5"/>
