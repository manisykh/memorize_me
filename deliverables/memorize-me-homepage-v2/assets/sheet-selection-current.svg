<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2340" viewBox="0 0 1080 2340" role="img" aria-labelledby="title desc">
  <title id="title">Memorize Me 최신 시트 선택 화면</title>
  <desc id="desc">Google Sheets 파일의 여러 시트를 선택해 각각의 단어장으로 가져오는 화면</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#09255A" flood-opacity=".08"/>
    </filter>
    <symbol id="doc" viewBox="0 0 48 48">
      <path d="M12 5h16l8 8v30H12z" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M28 5v9h8M18 23h12M18 30h12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="empty" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="3.2"/>
    </symbol>
    <symbol id="checked" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="20" fill="currentColor"/>
      <path d="M14 24l7 7 14-16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <style>
      text { font-family: Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif; }
      .ink { fill: #09255A; }
      .muted { fill: #5F6F8D; }
      .title { font-size: 48px; font-weight: 900; }
      .row-title { font-size: 38px; font-weight: 900; }
      .row-sub { font-size: 27px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1080" height="2340" fill="#F8FAFD"/>
  <rect width="1080" height="86" fill="#FFFFFF"/>
  <text x="54" y="58" font-size="28" font-weight="700" fill="#30343B">10:14</text>
  <g fill="#4B515A">
    <path d="M910 36l15 18 15-18z"/>
    <path d="M956 55l18-22v22z"/>
    <rect x="992" y="33" width="20" height="24" rx="3"/>
  </g>

  <rect y="86" width="1080" height="126" fill="#FFFFFF"/>
  <path d="M72 149h44M72 149l19-19M72 149l19 19" fill="none" stroke="#09255A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="166" class="ink title">단어장2</text>
  <text x="888" y="161" font-size="32" font-weight="900" fill="#1E73F7">가져오기</text>
  <line x1="0" y1="212" x2="1080" y2="212" stroke="#D9E2F0" stroke-width="2"/>

  <rect x="50" y="252" width="980" height="190" rx="30" fill="#EAF4FF"/>
  <rect x="86" y="296" width="94" height="94" rx="25" fill="#EAF2FF"/>
  <use href="#doc" x="109" y="319" width="48" height="48" color="#1E73F7"/>
  <text x="214" y="321" class="ink" font-size="37" font-weight="900">가져올 시트를 선택하세요</text>
  <text x="214" y="372" class="muted" font-size="28" font-weight="500">여러 시트를 선택하면 각각의 단어장으로 만듭니다.</text>

  <text x="54" y="526" fill="#1E73F7" font-size="46" font-weight="900">2개</text>
  <text x="132" y="526" class="ink" font-size="34" font-weight="900"> 선택됨</text>

  <g filter="url(#shadow)">
    <rect x="50" y="574" width="980" height="1190" rx="34" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="3"/>
  </g>

