      <rect x="28" y="36" width="98" height="98" rx="25" fill="#F8FAFD"/>
      <use href="#doc" x="53" y="61" width="48" height="48" color="#5F6F8D"/>
      <text x="158" y="77" class="ink row-title">Sheet1</text>
      <text x="158" y="121" class="muted row-sub">123개 단어</text>
      <use href="#empty" x="884" y="61" width="48" height="48" color="#D9E2F0"/>
    </g>
    <line x1="30" y1="170" x2="950" y2="170" stroke="#D9E2F0" stroke-width="2"/>

    <g transform="translate(0 170)">
