      <rect x="28" y="36" width="98" height="98" rx="25" fill="#F8FAFD"/>
      <use href="#doc" x="53" y="61" width="48" height="48" color="#5F6F8D"/>
      <text x="158" y="77" class="ink row-title">Day1</text>
      <text x="158" y="121" class="muted row-sub">98개 단어</text>
      <use href="#empty" x="884" y="61" width="48" height="48" color="#D9E2F0"/>
    </g>
    <line x1="30" y1="340" x2="950" y2="340" stroke="#D9E2F0" stroke-width="2"/>

    <g transform="translate(0 340)">
      <rect width="980" height="170" fill="#FFFFFF"/>
      <rect x="28" y="36" width="98" height="98" rx="25" fill="#F8FAFD"/>
      <use href="#doc" x="53" y="61" width="48" height="48" color="#5F6F8D"/>
      <text x="158" y="77" class="ink row-title">Day2</text>
      <text x="158" y="121" class="muted row-sub">156개 단어</text>
      <use href="#empty" x="884" y="61" width="48" height="48" color="#D9E2F0"/>
    </g>
    <line x1="30" y1="510" x2="950" y2="510" stroke="#D9E2F0" stroke-width="2"/>

    <g transform="translate(0 510)">
      <rect width="980" height="170" fill="#FFFFFF"/>
      <rect x="28" y="36" width="98" height="98" rx="25" fill="#F8FAFD"/>
      <use href="#doc" x="53" y="61" width="48" height="48" color="#5F6F8D"/>
      <text x="158" y="77" class="ink row-title">Day3</text>
      <text x="158" y="121" class="muted row-sub">87개 단어</text>
      <use href="#empty" x="884" y="61" width="48" height="48" color="#D9E2F0"/>
    </g>
    <line x1="30" y1="680" x2="950" y2="680" stroke="#D9E2F0" stroke-width="2"/>

    <g transform="translate(0 680)">
      <rect width="980" height="170" fill="#EAF4FF"/>
      <rect x="28" y="36" width="98" height="98" rx="25" fill="#EAF2FF"/>
      <use href="#doc" x="53" y="61" width="48" height="48" color="#1E73F7"/>
      <text x="158" y="77" class="ink row-title">Day4</text>
      <text x="158" y="121" class="muted row-sub">112개 단어</text>
      <use href="#checked" x="884" y="61" width="48" height="48" color="#1E73F7"/>
    </g>
    <line x1="30" y1="850" x2="950" y2="850" stroke="#D9E2F0" stroke-width="2"/>

    <g transform="translate(0 850)">
      <rect width="980" height="170" fill="#EAF4FF"/>
      <rect x="28" y="36" width="98" height="98" rx="25" fill="#EAF2FF"/>
      <use href="#doc" x="53" y="61" width="48" height="48" color="#1E73F7"/>
      <text x="158" y="77" class="ink row-title">Day5</text>
      <text x="158" y="121" class="muted row-sub">145개 단어</text>
      <use href="#checked" x="884" y="61" width="48" height="48" color="#1E73F7"/>
    </g>
    <line x1="30" y1="1020" x2="950" y2="1020" stroke="#D9E2F0" stroke-width="2"/>

    <g transform="translate(0 1020)">
      <rect width="980" height="170" rx="0 0 34 34" fill="#FFFFFF"/>
      <rect x="28" y="36" width="98" height="98" rx="25" fill="#F8FAFD"/>
      <use href="#doc" x="53" y="61" width="48" height="48" color="#5F6F8D"/>
      <text x="158" y="77" class="ink row-title">Day6</text>
      <text x="158" y="121" class="muted row-sub">77개 단어</text>
