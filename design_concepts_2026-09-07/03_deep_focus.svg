<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
      .en { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif; }
    </style>
    <radialGradient id="quietGlow" cx="50%" cy="43%" r="52%">
      <stop offset="0" stop-color="#23252A"/>
      <stop offset="1" stop-color="#101113"/>
    </radialGradient>
  </defs>

  <rect width="390" height="844" fill="#0D0E10"/>
  <rect width="390" height="570" fill="url(#quietGlow)"/>

  <!-- Minimal session controls -->
  <g class="ui">
    <circle cx="30" cy="38" r="18" fill="#191B1F" stroke="#2A2D32"/>
    <path d="M35 33L25 43M25 33L35 43" stroke="#E8E6DF" stroke-width="1.7" stroke-linecap="round"/>
    <text x="195" y="43" text-anchor="middle" fill="#B8B9B8" font-size="13" font-weight="650" letter-spacing=".8">FOCUS SESSION</text>
    <circle cx="360" cy="38" r="18" fill="#191B1F" stroke="#2A2D32"/>
    <path d="M355 37H359L364 32V44L359 39H355Z" fill="#E8E6DF"/>
  </g>

  <!-- Fine progress -->
  <rect x="20" y="78" width="350" height="2" rx="1" fill="#2A2C30"/>
  <rect x="20" y="78" width="117" height="2" rx="1" fill="#F0B35A"/>
  <text class="ui" x="20" y="105" fill="#777A80" font-size="11" font-weight="700" letter-spacing="1">4 / 12</text>
  <text class="ui" x="370" y="105" text-anchor="end" fill="#777A80" font-size="11" font-weight="600">Lesson 4</text>

  <!-- Word stage: no card container -->
  <g class="en">
    <text x="195" y="270" text-anchor="middle" fill="#F3F0E9" font-size="47" font-weight="610" letter-spacing="-.9">resilient</text>
    <text x="195" y="306" text-anchor="middle" fill="#94969A" font-size="16" font-weight="480">/rɪˈzɪliənt/</text>
  </g>
  <rect x="157" y="332" width="76" height="28" rx="14" fill="#1E2024"/>
  <text class="en" x="195" y="351" text-anchor="middle" fill="#C4C4C2" font-size="12" font-weight="650">adjective</text>

  <!-- Reveal divider and translation -->
  <line x1="72" y1="408" x2="318" y2="408" stroke="#292B2F"/>
  <g class="ui">
    <text x="195" y="458" text-anchor="middle" fill="#F0B35A" font-size="14" font-weight="720" letter-spacing=".6">쉽게 회복하는, 회복력이 강한</text>
    <text x="195" y="496" text-anchor="middle" fill="#8F9297" font-size="13" font-weight="500">어려움을 겪은 뒤 빠르게 원래 상태로</text>
    <text x="195" y="518" text-anchor="middle" fill="#8F9297" font-size="13" font-weight="500">돌아오는 힘이 있는</text>
  </g>

  <!-- Example -->
  <g class="en">
    <text x="28" y="593" fill="#65686E" font-size="11" font-weight="720" letter-spacing="1.3">EXAMPLE</text>
    <text x="28" y="626" fill="#D9D7D2" font-size="17" font-weight="510">Young learners are often more</text>
    <text x="28" y="652" fill="#D9D7D2" font-size="17" font-weight="510"><tspan fill="#F0B35A" font-weight="680">resilient</tspan> than they realize.</text>
  </g>

  <!-- Actions -->
  <g class="ui">
    <rect x="20" y="721" width="109" height="64" rx="20" fill="#1B1D21" stroke="#303339"/>
    <path d="M51 749A8 8 0 1 0 53 759" fill="none" stroke="#AAA9A5" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M48 747L52 749L50 753" fill="none" stroke="#AAA9A5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="760" text-anchor="middle" fill="#C9C7C1" font-size="15" font-weight="650">다시</text>

    <rect x="141" y="721" width="229" height="64" rx="20" fill="#F0B35A"/>
    <text x="244" y="760" text-anchor="middle" fill="#16130E" font-size="16" font-weight="780">알겠어요</text>
    <path d="M329 749L335 755L344 745" fill="none" stroke="#16130E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="ui" x="195" y="818" text-anchor="middle" fill="#4D5055" font-size="11" font-weight="550">좌우로 밀어도 답을 기록할 수 있어요</text>
</svg>
